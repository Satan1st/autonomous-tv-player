name: Publish TV player

on:
  push:
    branches: [main]
    paths: [index.html, player.js, catalog.json, .nojekyll, '.github/workflows/deploy-pages.yml']
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        default: main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: television-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/configure-pages@v5
      - name: Prepare static site
        run: |
          mkdir _site
          cp index.html player.js catalog.json .nojekyll _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
