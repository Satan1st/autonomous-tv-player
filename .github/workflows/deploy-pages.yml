name: Publish TV player

on:
  push:
    branches: [main]
    paths: [index.html, player.js, player.spec.js, stream-fetch.js, canvas-renderer.js, sources.json, 'vendor/**', .nojekyll, 'tools/smoke-playback.cjs', '.github/workflows/deploy-pages.yml']
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        default: main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: television-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-22.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/configure-pages@v5
      - name: Check player controls
        run: node player.spec.js
      - name: Prepare static site
        run: |
          mkdir _site
          cp index.html player.js stream-fetch.js canvas-renderer.js .nojekyll _site/
          cp -r vendor _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
      - name: Install playback test browser
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify published video playback and seeking
        env:
          PLAYER_URL: ${{ steps.deployment.outputs.page_url }}
          STOCK_CEF: '1'
        run: node tools/smoke-playback.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playback-results
          path: playback-results/
          if-no-files-found: ignore
          retention-days: 7
